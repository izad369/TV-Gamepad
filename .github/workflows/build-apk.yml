name: Build TV-Gamepad APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36.1 build-tools;36.1.0'

      # Do not use ./gradlew here.
      # The repository is missing gradle/wrapper/gradle-wrapper.jar,
      # which causes GradleWrapperMain ClassNotFoundException.
      # setup-gradle installs the exact Gradle version directly.
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Check Gradle installation
        run: gradle --version

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        run: |
          echo "APK files:"
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Gamepad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
